services:
  - type: web
    name: souqi-api
    runtime: docker
    rootDir: laravel-api
    dockerfilePath: ./Dockerfile
    preDeployCommand: php artisan migrate --force
    healthCheckPath: /ready
    plan: free
    envVars:
      - key: APP_NAME
        value: Souqi API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: souqi-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: souqi-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FILESYSTEM_DISK
        value: local

  - type: worker
    name: souqi-worker
    runtime: docker
    rootDir: laravel-api
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=90 --max-time=3600
    plan: starter
    envVars:
      - key: APP_NAME
        value: Souqi API Worker
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: souqi-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: souqi-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

  - type: cron
    name: souqi-scheduler
    runtime: docker
    rootDir: laravel-api
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan schedule:run
    schedule: "* * * * *"
    plan: starter
    envVars:
      - key: APP_NAME
        value: Souqi API Scheduler
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: souqi-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: souqi-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

databases:
  - name: souqi-db
    databaseName: souqi
    user: souqi
    plan: free
