groups:
  - name: ecommerce-api
    rules:
      - alert: EcommerceApiDown
        expr: up{job="ecommerce-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Ecommerce API metrics endpoint is down
          description: Prometheus cannot scrape the Ecommerce API for more than two minutes.

      - alert: EcommerceApiHighErrorRate
        expr: sum(rate(ecommerce_http_requests_total{job="ecommerce-api",status=~"5.."}[5m])) / clamp_min(sum(rate(ecommerce_http_requests_total{job="ecommerce-api"}[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Ecommerce API 5xx rate is above 5 percent

      - alert: EcommerceApiHighLatency
        expr: sum(rate(ecommerce_http_request_duration_ms_sum{job="ecommerce-api"}[5m])) / clamp_min(sum(rate(ecommerce_http_request_duration_ms_count{job="ecommerce-api"}[5m])), 1) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Ecommerce API average latency is above one second

      - alert: EcommerceFailedJobs
        expr: ecommerce_queue_failed_jobs{job="ecommerce-api"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Ecommerce has failed queue jobs

      - alert: EcommerceOutboxBacklog
        expr: ecommerce_outbox_pending_events{job="ecommerce-api"} > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Ecommerce outbox backlog is above 100 events

      - alert: EcommerceMetricsUnavailable
        expr: ecommerce_metrics_available{job="ecommerce-api"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Ecommerce metrics storage is unavailable
          description: The API cannot read its Redis-backed metrics storage.

      - alert: EcommerceAuthenticationFailures
        expr: sum(rate(ecommerce_http_requests_total{job="ecommerce-api",route=~"/api/v1/auth/.*",status=~"401|403|429"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Authentication failures are elevated
          description: Authentication and authorization failures exceed one request per second.

      - alert: EcommerceWebhookFailures
        expr: sum(rate(ecommerce_http_requests_total{job="ecommerce-api",route=~"/api/v1/webhooks/.*",status=~"4..|5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Payment or shipping webhook failures detected
          description: Signed webhook requests are returning errors.

      - alert: EcommercePaymentFailures
        expr: sum(rate(ecommerce_http_requests_total{job="ecommerce-api",route=~"/api/v1/payments.*",status=~"4..|5.."}[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Payment API failures are elevated
          description: Payment endpoints are returning client or server errors.
