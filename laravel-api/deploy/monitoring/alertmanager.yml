global:
  resolve_timeout: 5m

route:
  receiver: ecommerce-ops
  group_by: [alertname, job, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  - name: ecommerce-ops
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ecommerce-webhook-url
        send_resolved: true
