global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/ecommerce-alerts.yml

scrape_configs:
  - job_name: ecommerce-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['api.example.com']
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/ecommerce-metrics-token
