name: Staging Smoke Test

on:
  workflow_dispatch:
    inputs:
      staging_base_url:
        description: HTTPS base URL of the deployed staging API
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run public API smoke tests
        env:
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
        run: bash laravel-api/scripts/smoke-test.sh "$STAGING_BASE_URL"
