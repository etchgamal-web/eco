name: Frontend Applications

on:
  push:
    paths:
      - 'storefront/**'
      - 'admin-dashboard/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'storefront/**'
      - 'admin-dashboard/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  admin-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:production
        env:
          VITE_API_URL: https://api.example.com/api/v1
